name: nightly

# The nightly image of main, under `nightly` and `nightly-YYYYMMDD`. It is not signed or attested: the signing identity
# is only given to a release tag run (release.yml), and a nightly is neither a release nor a tag.
on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "43 4 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: nightly image
    # A manual run may pick any branch; only main is published. The weekly cron of the restore drill publishes nothing.
    if: ${{ github.ref == 'refs/heads/main' && github.event.schedule != '43 4 * * 0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # check out the repository
      packages: write # push the image
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: tags
        name: the tags of today's image
        run: node packages/testkit/scripts/release-tags.mjs "$(date -u +%F)" "$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: SHOUTORY_RELEASE_CHANNEL=nightly
          tags: ${{ steps.tags.outputs.tags }}
          push: true

  # Weekly (Sundays) and on request from any ref, so a release candidate can be drilled before its tag. It reads the
  # repository and builds its own throwaway stack: it pushes nothing and holds no token beyond reading.
  restore-drill:
    name: restore drill
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '43 4 * * 0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The browser build is the one the pinned Playwright package fixes; the stack builds its image itself.
      - run: pnpm exec playwright install --with-deps chromium
      - name: sign up, dump, lose the database volume, restore and sign in again
        env:
          SHOUTORY_E2E_RESTORE: "true"
        run: pnpm e2e --project restore
