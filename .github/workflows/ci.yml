        run: pnpm verify --only testkit-contract

  invariants:
    name: invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - id: verify
        run: pnpm verify --only invariants

  guard:
    name: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - id: verify
        run: pnpm verify --only guard

  capability-matrix:
    name: capability-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      # The generator reads the built registry.
      - run: pnpm exec tsc -b
      - id: verify
        run: pnpm verify --only capability-matrix

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - id: verify
        run: pnpm verify --only build

  e2e:
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read } # check out the repository
    # One job per shard of e2e/shards.json; each builds its own image and stack. The shards finish on their own.
    strategy:
      fail-fast: false
      matrix:
        shard: [a11y, visual-en, visual-ar, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      # The browser build is the one the pinned Playwright package fixes; the stack builds its image from the digest-pinned
      # base images of the Dockerfile.
      - run: pnpm exec playwright install --with-deps chromium
      # The input and the shard reach Playwright only through the environment; the screenshots are written when the input
      # is true.
      - run: pnpm verify --only e2e
        env:
          SHOUTORY_E2E_UPDATE_VISUAL: ${{ inputs.update-visual-snapshots }}
          SHOUTORY_E2E_SHARD: ${{ matrix.shard }}
      # Only a run asked to update the baselines uploads, after the e2e step passed, and only the screenshots: never a
      # trace or the saved session.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ success() && inputs.update-visual-snapshots && startsWith(matrix.shard, 'visual') }}
        with:
          name: visual-baselines-${{ matrix.shard }}
          path: e2e/specs/rtl-visual.spec.ts-snapshots/*.png
          if-no-files-found: error
          retention-days: 7

  image-smoke:
    name: image-smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # The image is built and run natively on each architecture, on its own runner (no emulation).
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions: { contents: read } # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify --only image-smoke

  upgrade:
    name: upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - id: verify
        run: pnpm verify --only upgrade

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: docker pull semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
      - id: verify
        run: pnpm verify --only semgrep

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: docker pull ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      # The whole history on a push; only the commits of the pull request on a pull request.
      - id: verify
        run: pnpm verify --only gitleaks
        env:
          GITLEAKS_LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}

  osv-scanner:
