name: ci

# Every job runs one step of the local check command (`pnpm verify --only <step>`), so a local run and a
# CI run are the same checks. The final job fails unless every job succeeded and no job reported a
# placeholder that .github/ci-placeholders.json does not list.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - id: verify
        run: pnpm verify --only typecheck

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - id: verify
        run: pnpm verify --only lint

  knip:
    name: knip
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
