        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: docker pull ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
      - id: verify
        run: pnpm verify --only zizmor

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - id: verify
        run: pnpm verify --only audit

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      # The lockfile check compares with the first parent, so one earlier commit is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - id: verify
        run: pnpm verify --only supply-chain

  commit-message:
    name: commit-message
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      # A pull request is judged by its title (the squash commit); a push by its head commit message.
      - id: verify
        run: pnpm verify --only commit-message
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  ci:
    name: ci
    if: always()
    needs:
      - typecheck
      - lint
      - knip
      - unit
      - unit-chatham
      - integration
      - contract
      - testkit-contract
      - invariants
      - guard
      - capability-matrix
      - build
      - e2e
      - image-smoke
      - upgrade
      - semgrep
      - gitleaks
      - osv-scanner
      - actionlint
      - zizmor
      - audit
      - supply-chain
      - commit-message
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read } # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: node scripts/ci-aggregate.mjs
        env:
          NEEDS: ${{ toJSON(needs) }}
