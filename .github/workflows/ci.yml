name: ci

# Every job runs one step of the local check command (`pnpm verify --only <step>`), so a local run and a
# CI run are the same checks. The final job fails unless every job succeeded and no job reported a
# placeholder that .github/ci-placeholders.json does not list.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  # A run started by hand can make new screenshot baselines: the visual project runs on Linux only, which is this runner.
  workflow_dispatch:
    inputs:
      update-visual-snapshots:
        description: Write new screenshot baselines and upload them as an artifact
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - id: verify
        run: pnpm verify --only typecheck

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - id: verify
        run: pnpm verify --only lint

  knip:
    name: knip
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - id: verify
        run: pnpm verify --only knip

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - id: verify
        run: pnpm verify --only unit

  unit-chatham:
    name: unit-chatham
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - id: verify
        run: pnpm verify --only unit-chatham

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    # Throwaway values for a database that lives only as long as this job; never reuse them anywhere else.
    env:
      SHOUTORY_DATABASE_PASSWORD_OWNER: owner-ci-password
      SHOUTORY_DATABASE_PASSWORD_APP: app-ci-password
      SHOUTORY_DATABASE_PASSWORD_WORKER: worker-ci-password
      SHOUTORY_DATABASE_PASSWORD_AUTH: auth-ci-password
      SHOUTORY_DATABASE_PASSWORD_READONLY: readonly-ci-password
      SHOUTORY_DATABASE_URL_OWNER: postgres://shoutory_owner:owner-ci-password@localhost:5432/shoutory
      SHOUTORY_DATABASE_URL_APP: postgres://shoutory_app:app-ci-password@localhost:5432/shoutory
      SHOUTORY_DATABASE_URL_WORKER: postgres://shoutory_worker:worker-ci-password@localhost:5432/shoutory
      SHOUTORY_DATABASE_URL_AUTH: postgres://shoutory_auth:auth-ci-password@localhost:5432/shoutory
      SHOUTORY_DATABASE_URL_READONLY: postgres://shoutory_readonly:readonly-ci-password@localhost:5432/shoutory
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_DB: shoutory
          POSTGRES_PASSWORD: postgres-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d shoutory"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      # A service container cannot mount files, so the role script runs inside it with the image's own psql.
      - name: create the database roles
        env:
          PG_ID: ${{ job.services.postgres.id }}
        run: >-
          docker exec -i
          -e SHOUTORY_DATABASE_PASSWORD_OWNER -e SHOUTORY_DATABASE_PASSWORD_APP
          -e SHOUTORY_DATABASE_PASSWORD_WORKER -e SHOUTORY_DATABASE_PASSWORD_AUTH
          -e SHOUTORY_DATABASE_PASSWORD_READONLY
          "$PG_ID" psql -U postgres -d shoutory -v ON_ERROR_STOP=1 < docker/postgres/init.sql
      # The same script again proves it is safe to rerun on a database that already has the roles.
      - name: run the role script again
        env:
          PG_ID: ${{ job.services.postgres.id }}
        run: >-
          docker exec -i
          -e SHOUTORY_DATABASE_PASSWORD_OWNER -e SHOUTORY_DATABASE_PASSWORD_APP
          -e SHOUTORY_DATABASE_PASSWORD_WORKER -e SHOUTORY_DATABASE_PASSWORD_AUTH
          -e SHOUTORY_DATABASE_PASSWORD_READONLY
          "$PG_ID" psql -U postgres -d shoutory -v ON_ERROR_STOP=1 < docker/postgres/init.sql
      # A service container cannot pass the command arguments the S3 gateway needs, so a step starts it. The image is the
      # one the tests were built against; its keys are throwaway test values that the tests carry too.
      - name: start the S3 simulator
        run: >-
          docker run -d --name shoutory-s3 -p 127.0.0.1:7070:7070 --tmpfs /data
          versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
          --access shoutory-s3-access-1 --secret shoutory-s3-secret-1 posix /data
      # Any HTTP status means the gateway listens (an unsigned request is answered 403); 000 means no connection yet.
      - name: wait for the S3 simulator
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7070/)
            if [ "$code" != 000 ]; then exit 0; fi
            sleep 1
          done
          echo "the S3 simulator did not answer" >&2
          exit 1
      - id: verify
        env:
          SHOUTORY_TEST_ADMIN_URL: postgres://postgres:postgres-ci-password@localhost:5432/shoutory
          SHOUTORY_TEST_S3_URL: http://127.0.0.1:7070
        run: pnpm verify --only integration

  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read } # check out the repository
    outputs: { placeholder: "${{ steps.verify.outputs.placeholder }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - id: verify
        run: pnpm verify --only contract

  testkit-contract:
