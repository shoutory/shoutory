        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      # A pull request is judged by its title (the squash commit); a push by its head commit message.
      - id: verify
        run: pnpm verify --only commit-message
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  ci:
    name: ci
    if: always()
    needs:
      - typecheck
      - lint
      - knip
      - unit
      - unit-chatham
      - integration
      - contract
      - testkit-contract
      - invariants
      - guard
      - build
      - e2e
      - image-smoke
      - upgrade
      - semgrep
      - gitleaks
      - osv-scanner
      - actionlint
      - zizmor
      - audit
      - supply-chain
      - commit-message
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read } # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: node scripts/ci-aggregate.mjs
        env:
          NEEDS: ${{ toJSON(needs) }}
