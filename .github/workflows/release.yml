name: release

# Opens and updates the release pull request from the conventional commits on main (stable) or beta (prerelease, with
# its own config and manifest); merging it creates the tag and the release notes. A pull request or tag made with the
# workflow token starts no workflow, so the release pull request has no checks: a maintainer merges it with the
# ruleset bypass, or closes and reopens it to start them. For the same reason the new tag does not start the release
# run by itself: the job that made it starts this workflow on the tag, the one event the workflow token may start.
on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    # Release pull requests come from main and beta only. The run that builds a tag is this workflow dispatched on the
    # tag, and a manual run on any other ref, and neither may open one.
    if: ${{ github.ref_name == 'main' || github.ref_name == 'beta' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
      pull-requests: write # open and update the release pull request
      issues: write # move the release labels
      actions: write # start the release run on the new tag
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: ${{ github.ref_name == 'beta' && 'release-please-config.beta.json' || 'release-please-config.json' }}
          manifest-file: ${{ github.ref_name == 'beta' && '.release-please-manifest.beta.json' || '.release-please-manifest.json' }}
      - name: start the release run on the new tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --ref "$TAG"

  # The tag run: every architecture and both images are built on their own native runner and pushed by digest only. This
  # job holds no OIDC permission and signs nothing; the image job below does that on the merged digests.
  build:
    name: build (${{ matrix.target }}, ${{ matrix.runner }})
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        target: [nonroot, debug]
    permissions:
      contents: read # check out the repository
      packages: write # push the image by digest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: a major release has its upgrade note
        env:
          TAG: ${{ github.ref_name }}
        run: node packages/testkit/scripts/upgrade-note.mjs "$TAG"
      - id: tags
        name: the channel of the tag
        env:
          TAG: ${{ github.ref_name }}
        run: node packages/testkit/scripts/release-tags.mjs "$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target == 'debug' && 'debug' || '' }}
          build-args: SHOUTORY_RELEASE_CHANNEL=${{ steps.tags.outputs.channel }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
      - name: keep the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.target }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merges the architectures of each image under its tags, signs the merged digests and attests them. The only job that
  # holds the OIDC permission, and it runs only in the protected release environment, on a tag.
  image:
    name: image
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read # check out the repository
      packages: write # tag the merged image and store its signature and attestations
      id-token: write # the signing identity of this workflow run
      attestations: write # store the provenance
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: tags
        name: the tags of the release
        env:
          TAG: ${{ github.ref_name }}
        run: node packages/testkit/scripts/release-tags.mjs "$TAG" "$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-nonroot-*
          path: ${{ runner.temp }}/digests/nonroot
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-debug-*
          path: ${{ runner.temp }}/digests/debug
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: merge
        name: put the architectures under the release tags
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          DEBUG_TAGS: ${{ steps.tags.outputs.debug_tags }}
        run: |
          set -euo pipefail
          # Merges the digests of one target under its tags and leaves the merged digest in $merged. It is called
          # directly, never inside a command substitution, so a failure here stops the step.
          merge() {
            local refs=() tag_args=() tag file listed
            for file in "$RUNNER_TEMP/digests/$1"/*; do
              [ -e "$file" ] || { echo "no digests for $1" >&2; exit 1; }
              refs+=("$IMAGE@sha256:${file##*/}")
            done
            IFS=',' read -ra listed <<< "$2"
            [ -n "${listed[0]:-}" ] || { echo "no tags for $1" >&2; exit 1; }
            for tag in "${listed[@]}"; do tag_args+=(-t "$tag"); done
            docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
            merged=$(docker buildx imagetools inspect "${listed[0]}" --format '{{.Manifest.Digest}}')
            [[ "$merged" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "not a digest: $merged" >&2; exit 1; }
          }
          merge nonroot "$TAGS"
          echo "digest=$merged" >> "$GITHUB_OUTPUT"
          merge debug "$DEBUG_TAGS"
          echo "debug_digest=$merged" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: sign the merged digests
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          DEBUG_DIGEST: ${{ steps.merge.outputs.debug_digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign sign --yes "$IMAGE@$DEBUG_DIGEST"
      - name: verify the signatures against this workflow's identity
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          DEBUG_DIGEST: ${{ steps.merge.outputs.debug_digest }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          for digest in "$DIGEST" "$DEBUG_DIGEST"; do
            cosign verify "$IMAGE@$digest" --certificate-identity "https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG" --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          syft-version: v1.56.0
          upload-artifact: false
          upload-release-assets: false
      - name: attach the SBOM to the image digest
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.debug_digest }}
          push-to-registry: true
          create-storage-record: false
