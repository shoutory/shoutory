name: labeler

# Adds the area labels from the changed paths. Pull requests from forks are labelled by hand: a fork run
# gets a read-only token, and the write-capable triggers are banned in this repository.
on:
  pull_request:

permissions: {}

concurrency:
  group: labeler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: label
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # read the label rules
      pull-requests: write # add labels to the pull request
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
