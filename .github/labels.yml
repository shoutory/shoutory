# The only source of the repository's labels. The label-sync workflow makes the repository match this file,
# so a label created by hand is removed by the next sync. The two `autorelease:` labels are created and
# moved by the release tool; they are listed so the sync never deletes them.
- { name: "type:bug", color: d73a4a, description: Something is not working as documented }
- { name: "type:feature", color: d73a4a, description: A new capability or an improvement }
- { name: "type:question", color: d73a4a, description: A usage question that is not a defect }

- { name: "area:web", color: 1d76db, description: The web app }
- { name: "area:api", color: 1d76db, description: The API server and the core rules }
- { name: "area:worker", color: 1d76db, description: Background jobs and publishing workers }
- { name: "area:db", color: 1d76db, description: Database schema, migrations and policies }
- { name: "area:sdk", color: 1d76db, description: The Node SDK }
- { name: "area:cli", color: 1d76db, description: The command line tools }
- { name: "area:mcp", color: 1d76db, description: The MCP server }
- { name: "area:docs", color: 1d76db, description: Documentation }
- { name: "area:ci", color: 1d76db, description: Workflows, checks and release tooling }

- { name: "provider:bluesky", color: "5319e7", description: Bluesky }
- { name: "provider:mastodon", color: "5319e7", description: Mastodon }
- { name: "provider:telegram", color: "5319e7", description: Telegram }
- { name: "provider:discord", color: "5319e7", description: Discord }

- { name: "status:needs-repro", color: fbca04, description: Waiting for steps that reproduce the problem }
- { name: "status:blocked", color: fbca04, description: Waiting on something outside the change }
- { name: "status:needs-decision", color: fbca04, description: Waiting for a maintainer decision }

- { name: "breaking", color: b60205, description: Changes behaviour that users rely on }
- { name: "good first issue", color: 7057ff, description: A good place to start contributing }
- { name: "help wanted", color: "008672", description: Maintainers welcome a contribution }
- { name: "security", color: ee0701, description: Hardening work; report vulnerabilities privately }
- { name: "dependencies", color: 0366d6, description: A dependency update }

- { name: "autorelease: pending", color: ededed, description: Managed by the release tool }
- { name: "autorelease: tagged", color: ededed, description: Managed by the release tool }
