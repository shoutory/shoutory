# PostgreSQL for local development, bound to this machine only. Every credential comes from the environment and
# compose refuses to start when one is unset or empty.
services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: shoutory
      POSTGRES_PASSWORD: ${SHOUTORY_POSTGRES_PASSWORD:?set SHOUTORY_POSTGRES_PASSWORD}
      SHOUTORY_DATABASE_PASSWORD_OWNER: ${SHOUTORY_DATABASE_PASSWORD_OWNER:?set SHOUTORY_DATABASE_PASSWORD_OWNER}
      SHOUTORY_DATABASE_PASSWORD_APP: ${SHOUTORY_DATABASE_PASSWORD_APP:?set SHOUTORY_DATABASE_PASSWORD_APP}
      SHOUTORY_DATABASE_PASSWORD_WORKER: ${SHOUTORY_DATABASE_PASSWORD_WORKER:?set SHOUTORY_DATABASE_PASSWORD_WORKER}
      SHOUTORY_DATABASE_PASSWORD_AUTH: ${SHOUTORY_DATABASE_PASSWORD_AUTH:?set SHOUTORY_DATABASE_PASSWORD_AUTH}
      SHOUTORY_DATABASE_PASSWORD_READONLY: ${SHOUTORY_DATABASE_PASSWORD_READONLY:?set SHOUTORY_DATABASE_PASSWORD_READONLY}
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
