packages:
  - apps/*
  - packages/*
  - packages/providers/*

# 14 days in minutes. An exclusion is a time-boxed emergency and carries a dated comment.
minimumReleaseAge: 20160
minimumReleaseAgeExclude: []

strictDepBuilds: true
trustPolicy: no-downgrade
blockExoticSubdeps: true
saveExact: true
strictPeerDependencies: true

# 2026-11-17: GHSA-fc5q-39xc-vjpf (picomatch <= 4.0.7, ReDoS through repeated extglobs) reaches development tooling
# only (vitest > vite, tinyglobby), and its glob patterns come from repository config, never from input. No patched
# picomatch exists. Remove this ignore when the patched release lands; it expires on 2026-12-17.
audit:
  ignore:
    - GHSA-fc5q-39xc-vjpf

# 2026-11-21: the Stryker mutation runner (a development tool; no commit runs it) pulls vulnerable versions of two
# packages. `typed-rest-client` pins qs 6.15.1 exactly: GHSA-4mjr-xmp4-gh2g, GHSA-6pq8-jhm2-2vcw, GHSA-q8mj-m7cp-5q26,
# GHSA-x5fp-wj9c-mxmx (fixed by 6.16.1). Stryker core takes minimatch 10.2.6: GHSA-g3hv-75wg-m249 (fixed in 11.0.1).
# Remove each override when Stryker ships the fixed version.
overrides:
  "typed-rest-client>qs": 6.16.2
  "@stryker-mutator/core>minimatch": 11.0.4

# Packages allowed to run install scripts.
allowBuilds:
  esbuild: false
  # Pulled in by the OTLP exporter; its postinstall only checks a version and installs nothing.
  protobufjs: false
